# V4.5 final recipe; paths are expanded from environment variables.
# Monitor cases also receive gradients; their metrics are not held-out validation.
# The archived epoch-118 tuning phase is preserved; see README.md.
experiment:
  version: v4.5-train75-exact-pet-controlled-ray-dgx
  recipe_revision: exact-pet-supervision-19pct-controlled-ray-dgx-20260806
data:
  data_dir: ${GEOPACT_DATA_DIR}
  val_subjects:
  - sub-000
  - sub-001
  include_val_subjects_in_train: true
  val_count: 2
  num_workers: 0
  prefetch_factor: 1
  persistent_workers: false
  pin_memory: false
  cache_rate: 0.0
pet_supervision:
  enabled: true
  expected_train_subjects:
  - sub-000
  - sub-001
  - sub-002
  - sub-005
  - sub-006
  - sub-008
  - sub-013
  - sub-014
  expected_val_subjects:
  - sub-000
  - sub-001
  require_expected_subjects: true
  cache_dir: ${GEOPACT_CACHE_DIR}
  mask_supersample_factor: 2
  oversample:
    enabled: true
    target_fraction: 0.19
output:
  output_dir: ${GEOPACT_OUTPUT_DIR}
input:
  channels:
  - nacpet
  - z_coord
  - topogram
  - y_coord
  - mri_in
  - mri_out
  - mri_absdiff
model:
  name: gated_topogram_conditioned_mri_resunet3d
  in_channels: 7
  geometry_in_channels: 2
  geometry_channel_indices:
  - 0
  - 1
  topogram_channel_index: 2
  topogram_gate_init_bias: -2.0
  topogram_conditioned:
    enabled: true
    scales:
    - s4
    - bottleneck
    coord_channels:
    - y
    coord_channel_indices:
    - 3
    gate_bias: -1.0
    coord_fourier_bands: 3
    coord_embedding_channels: 8
    residual_init_scale: 0.01
  mri_channel_indices:
  - 4
  - 5
  - 6
  mri_base_channels: 12
  mri_gate_init_bias: -2.0
  global_context:
    enabled: true
    supervise_auxiliary: false
    in_channels: 3
    spatial_size:
    - 96
    - 96
    - 128
    base_channels: 8
    dropout: 0.1
    film_strength: 0.1
    checkpoint_blocks: true
    reuse_per_subject: true
  out_channels: 1
  output_units: hu
  base_channels: 24
  dropout: 0.2
metadata:
  use_film: false
  keys:
  - sex
  - age
  - height
  - weight
  - bmi
preprocess:
  ct_min: -1000
  ct_max: 2000
  nacpet_percentiles:
  - 0.5
  - 99.5
  mri_percentiles:
  - 0.5
  - 99.5
  topogram_percentiles:
  - 0.5
  - 99.5
augmentation:
  mri_dropout_prob: 0.0
  topogram_dropout_prob: 0.0
  mri_shift_prob: 0.0
  mri_shift_voxels: 1
validation:
  crop_mask_key: prediction_mask
full_volume_validation:
  enabled: true
  every: 25
  start_epoch: 25
  output_dir: full_volume_val
  save_predictions: true
  hf_upload:
    enabled: false
  metric_device: cpu
  min_organ_voxels: 64
  exclusion_cm: 4.0
training:
  epochs: 150
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  patch_size:
  - 160
  - 160
  - 192
  train_num_samples: 8
  val_num_samples: 4
  crop_mask_key: prediction_mask
  min_mask_fraction: 0.35
  max_crop_attempts: 16
  region_sampling:
    enabled: true
    axis: 2
    mandatory_regions:
    - head_neck
    - head_neck
    regions:
    - name: lower_body
      min: 0.0
      max: 0.22
      weight: 0.15
    - name: abdomen_pelvis
      min: 0.22
      max: 0.55
      weight: 0.3
    - name: thorax
      min: 0.55
      max: 0.78
      weight: 0.3
    - name: head_neck
      min: 0.78
      max: 1.0
      weight: 0.25
  amp: true
  amp_init_scale: 4096
  grad_accum_steps: 1
  grad_clip: 12.0
  seed: 42
  save_every: 25
  emergency_save_interval_steps: 0
inference:
  patch_size:
  - 160
  - 160
  - 192
  sw_batch_size: 1
  overlap: 0.5
