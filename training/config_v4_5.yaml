    delta_clip: 0.5
    orth_weight: 1.0
    multi_angle_weight: 0.0
    axis_weights:
    - 1.0
    - 1.0
    - 1.0
    angles_deg: []
    angle_weights: []
    downsample_factor: 2
  global_projection:
    error_domain: relative_acf
    delta_clip: 0.5
    tail_fraction: 0.05
    orth_weight: 0.25
    multi_angle_weight: 0.75
    axis_weights:
    - 1.0
    - 1.0
    - 1.0
    angles_deg:
    - -67.5
    - -45.0
    - -22.5
    - 0.0
