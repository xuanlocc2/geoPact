    enabled: false
    error_domain: relative_acf
    delta_clip: 0.5
    tail_fraction: 0.05
    region_name: head_neck
    superior_fraction: 0.22
    spatial_axis: 2
    orth_weight: 0.0
    multi_angle_weight: 1.0
    axis_weights:
    - 1.0
    - 1.0
    - 0.0
    angles_deg:
    - -45.0
    - 0.0
    - 45.0
    angle_weights:
    - 1.0
    - 1.0
    - 1.0
    downsample_factor: 2
  regional_projection:
    enabled: false
    error_domain: relative_acf
    delta_clip: 0.5
    tail_fraction: 0.05
